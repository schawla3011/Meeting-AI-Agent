services:
  - type: web
    name: antigravity-meeting-recorder
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # paste value in Render dashboard
      - key: SMTP_EMAIL
        sync: false   # Gmail address e.g. mom.pravah.ai@gmail.com
      - key: SMTP_PASSWORD
        sync: false   # Gmail App Password (myaccount.google.com/apppasswords)
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
