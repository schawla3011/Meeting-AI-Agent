services:
  - type: web
    name: antigravity-meeting-recorder
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # paste value in Render dashboard
      - key: BREVO_API_KEY
        sync: false   # PRIMARY email sender – get free key at app.brevo.com
      - key: SMTP_EMAIL
        sync: false   # Gmail address (fallback – may be blocked on Render free tier)
      - key: SMTP_PASSWORD
        sync: false   # Gmail App Password (fallback)
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
