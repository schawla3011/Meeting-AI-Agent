services:
  - type: web
    name: antigravity-meeting-recorder
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # paste value in Render dashboard
      - key: BREVO_API_KEY
        sync: false   # get free key at brevo.com — primary email provider (HTTPS)
      - key: SMTP_EMAIL
        sync: false   # Gmail address — local dev fallback only
      - key: SMTP_PASSWORD
        sync: false   # Gmail App Password — local dev fallback only
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
